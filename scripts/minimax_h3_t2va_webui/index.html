<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniMax-H3 FP8 文生视频</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101114; color: #f2f3f5; }
    main { width: min(980px, calc(100% - 32px)); margin: 40px auto; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); }
    .sub { color: #9ea3ad; margin: 0 0 28px; }
    .panel { background: #181a1f; border: 1px solid #2b2e36; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
    label { display: block; font-weight: 650; margin-bottom: 8px; }
    textarea, input { width: 100%; color: inherit; background: #101114; border: 1px solid #363a44; border-radius: 9px; padding: 12px; font: inherit; }
    textarea { min-height: 150px; resize: vertical; line-height: 1.55; }
    textarea:focus, input:focus { outline: 2px solid #6d8cff; border-color: transparent; }
    .row { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; margin-top: 18px; }
    .range-head { display: flex; justify-content: space-between; }
    input[type="range"] { padding: 8px 0; border: 0; background: transparent; accent-color: #6d8cff; }
    .hint { color: #858b96; font-size: 13px; margin-top: 6px; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button, .download { border: 0; border-radius: 9px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    button.primary { background: #6d8cff; color: #fff; }
    button.secondary, .download { background: #292c34; color: #e9eaf0; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #statusPanel[hidden], #resultPanel[hidden], #cancel[hidden] { display: none; }
    .status-line { display: flex; justify-content: space-between; gap: 20px; }
    .bar { height: 7px; background: #292c34; border-radius: 99px; overflow: hidden; margin-top: 14px; }
    .bar > div { width: 35%; height: 100%; background: #6d8cff; border-radius: inherit; animation: move 1.3s ease-in-out infinite alternate; }
    .bar.done > div { width: 100%; animation: none; }
    @keyframes move { from { transform: translateX(-70%); } to { transform: translateX(260%); } }
    video { display: block; width: 100%; background: #000; border-radius: 10px; }
    .metrics { color: #a9aeba; margin: 12px 0; line-height: 1.6; }
    .error { color: #ff8d8d; white-space: pre-wrap; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } main { margin-top: 24px; } }
  </style>
</head>
<body>
<main>
  <h1>MiniMax-H3 FP8 文生视频</h1>
  <p class="sub">FP8 · 1344×768 · 24 FPS · 50 steps · 自动生成同步音频 · 单任务排队</p>

  <form id="form" class="panel">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" name="prompt" maxlength="4000" required placeholder="描述场景、主体、动作、镜头和声音……"></textarea>
    <div class="row">
      <div>
        <div class="range-head"><label for="seconds">时长</label><strong><span id="durationValue">5</span> 秒</strong></div>
        <input id="seconds" name="seconds" type="range" min="4" max="15" step="1" value="5">
        <div class="hint">MiniMax-H3 支持 4–15 秒；时长越长，生成时间和显存占用越高。</div>
      </div>
      <div>
        <label for="seed">Seed</label>
        <input id="seed" name="seed" type="number" min="0" max="2147483647" value="1101">
        <div class="hint">相同 prompt 与 seed 可复现。</div>
      </div>
    </div>
    <div class="actions">
      <button id="submit" class="primary" type="submit">生成视频</button>
      <button id="cancel" class="secondary" type="button" hidden>取消任务</button>
    </div>
    <p id="formError" class="error" role="alert"></p>
  </form>

  <section id="statusPanel" class="panel" hidden>
    <div class="status-line"><strong id="statusText">正在提交</strong><span id="elapsed">0:00</span></div>
    <div id="bar" class="bar"><div></div></div>
    <div id="jobId" class="hint"></div>
  </section>

  <section id="resultPanel" class="panel" hidden>
    <video id="video" controls playsinline></video>
    <div id="metrics" class="metrics"></div>
    <a id="download" class="download" download>保存 MP4</a>
  </section>
</main>

<script>
  const form = document.querySelector('#form');
  const submit = document.querySelector('#submit');
  const cancel = document.querySelector('#cancel');
  const statusPanel = document.querySelector('#statusPanel');
  const resultPanel = document.querySelector('#resultPanel');
  const statusText = document.querySelector('#statusText');
  const elapsed = document.querySelector('#elapsed');
  const jobIdText = document.querySelector('#jobId');
  const bar = document.querySelector('#bar');
  const errorText = document.querySelector('#formError');
  const seconds = document.querySelector('#seconds');
  const durationValue = document.querySelector('#durationValue');
  let jobId = localStorage.getItem('h3_job_id');
  let startedAt = Number(localStorage.getItem('h3_started_at')) || 0;
  let pollTimer = null;
  let clockTimer = null;

  if (new URLSearchParams(location.search).has('token')) history.replaceState({}, '', location.pathname);
  seconds.addEventListener('input', () => { durationValue.textContent = seconds.value; });

  function setBusy(busy) {
    submit.disabled = busy;
    cancel.hidden = !busy;
  }

  function startClock() {
    clearInterval(clockTimer);
    const update = () => {
      const total = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
      elapsed.textContent = `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
    };
    update();
    clockTimer = setInterval(update, 1000);
  }

  async function poll() {
    if (!jobId) return;
    try {
      const response = await fetch(`/api/videos/${jobId}`);
      const data = await response.json();
      if (!response.ok && data.status !== 'failed') throw new Error(data.detail || JSON.stringify(data));
      statusPanel.hidden = false;
      jobIdText.textContent = jobId;
      if (data.status === 'completed') {
        clearTimeout(pollTimer);
        clearInterval(clockTimer);
        setBusy(false);
        statusText.textContent = '生成完成';
        bar.classList.add('done');
        const content = `/api/videos/${jobId}/content`;
        document.querySelector('#video').src = content;
        document.querySelector('#download').href = content;
        const denoise = data.stage_durations?.['MiniMaxH3Pipeline.diffuse'];
        document.querySelector('#metrics').textContent = `端到端 ${Number(data.inference_time_s || 0).toFixed(1)} 秒` +
          (denoise ? ` · 去噪 ${Number(denoise).toFixed(1)} 秒` : '') +
          (data.peak_memory_mb ? ` · 峰值显存 ${Math.round(data.peak_memory_mb).toLocaleString()} MiB` : '');
        resultPanel.hidden = false;
        localStorage.removeItem('h3_job_id');
        localStorage.removeItem('h3_started_at');
        return;
      }
      if (data.status === 'failed') throw new Error(data.error?.message || '生成失败');
      statusText.textContent = data.status === 'queued' ? '任务排队中' : 'MiniMax-H3 正在生成';
      pollTimer = setTimeout(poll, 3000);
    } catch (error) {
      clearInterval(clockTimer);
      setBusy(false);
      statusText.textContent = '任务失败';
      errorText.textContent = error.message;
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorText.textContent = '';
    resultPanel.hidden = true;
    statusPanel.hidden = false;
    bar.classList.remove('done');
    statusText.textContent = '正在提交任务';
    setBusy(true);
    startedAt = Date.now();
    startClock();
    try {
      const response = await fetch('/api/videos', { method: 'POST', body: new FormData(form) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || data.error?.message || JSON.stringify(data));
      jobId = data.id;
      localStorage.setItem('h3_job_id', jobId);
      localStorage.setItem('h3_started_at', String(startedAt));
      await poll();
    } catch (error) {
      clearInterval(clockTimer);
      setBusy(false);
      statusText.textContent = '提交失败';
      errorText.textContent = error.message;
    }
  });

  cancel.addEventListener('click', async () => {
    if (!jobId || !confirm('确定取消当前生成任务？')) return;
    const response = await fetch(`/api/videos/${jobId}`, { method: 'DELETE' });
    if (response.ok) {
      clearTimeout(pollTimer);
      clearInterval(clockTimer);
      localStorage.removeItem('h3_job_id');
      localStorage.removeItem('h3_started_at');
      jobId = null;
      setBusy(false);
      statusText.textContent = '任务已取消';
    }
  });

  if (jobId) {
    statusPanel.hidden = false;
    setBusy(true);
    startClock();
    poll();
  }
</script>
</body>
</html>
