<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <title>MiniMax H3 disaggregated GPU memory architecture</title>
  <desc>Only the GPU-memory-consuming text encoder and diffusion components are shown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1600" height="700" fill="#fff"/>

  <text x="800" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#000">
    MiniMax H3 Disaggregated Deployment
  </text>
  <text x="800" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#000">
    GPU memory view
  </text>

  <rect x="90" y="175" width="500" height="350" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="115" y="215" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000">STAGE 0 — GPU MEMORY</text>

  <rect x="140" y="265" width="400" height="155" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="340" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#000">
    MiniMaxH3TextEncoder
  </text>
  <text x="340" y="349" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#000">
    Qwen3-VL Transformer weights
  </text>
  <text x="340" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#000">
    KV / prefix cache + activations
  </text>

  <text x="340" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#000">
    Tensor Parallel
  </text>

  <line x1="590" y1="350" x2="1002" y2="350" stroke="#000" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="650" y="262" width="300" height="72" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="800" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#000">
    BF16 hidden states [S, 5120]
  </text>
  <text x="800" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#000">
    + token-role tags [S]
  </text>

  <rect x="1010" y="175" width="500" height="350" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="1035" y="215" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000">STAGE 1 — GPU MEMORY</text>

  <rect x="1060" y="265" width="185" height="155" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="1152" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#000">H3 DiT</text>
  <text x="1152" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#000">Weights</text>
  <text x="1152" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#000">Activations</text>

  <line x1="1245" y1="343" x2="1284" y2="343" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1292" y="265" width="168" height="155" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="1376" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#000">Video VAE</text>
  <text x="1376" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#000">Audio VAE</text>
  <text x="1376" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#000">Weights + buffers</text>

  <text x="1260" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#000">
    Ulysses / denoising
  </text>

  <text x="800" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#000">
    CPU preprocessing and MP4 output are omitted because they are not major GPU-memory consumers.
  </text>
</svg>
