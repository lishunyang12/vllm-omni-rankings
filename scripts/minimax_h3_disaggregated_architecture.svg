<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080">
  <title>RTX PRO 5000 MiniMax H3 NIXL test plan</title>
  <desc>Title-free component diagram comparing inline orchestrator payload transfer with direct NIXL transfer on an eight-card PCIe-only RTX PRO 5000 host.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1900" height="1080" fill="#fff"/>

  <!-- Stage 0 -->
  <rect x="40" y="55" width="450" height="350" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="70" y="98" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#000">STAGE 0</text>
  <text x="460" y="98" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#000">GPU 0,1 · NUMA 0</text>

  <rect x="90" y="135" width="350" height="125" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="265" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#000">MiniMaxH3TextEncoder</text>
  <text x="265" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#000">one encoder instance · TP2</text>
  <text x="265" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#000">2 × RTX PRO 5000 72 GB</text>

  <rect x="90" y="295" width="350" height="75" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="265" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#000">Payload producer</text>
  <text x="265" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#000">register Stage 0 GPU buffer</text>

  <!-- NIXL direct path -->
  <line x1="490" y1="230" x2="582" y2="230" stroke="#000" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="590" y="110" width="410" height="240" fill="#fff" stroke="#000" stroke-width="5"/>
  <text x="795" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#000">B — NIXL ON</text>

  <rect x="635" y="175" width="320" height="62" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="795" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000">ZMQ control plane</text>
  <text x="795" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#000">metadata only</text>

  <rect x="635" y="260" width="320" height="62" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="795" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000">NIXL / UCX data plane</text>
  <text x="795" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#000">consumer READ · direct worker path</text>

  <line x1="1000" y1="230" x2="1092" y2="230" stroke="#000" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="520" y="375" width="550" height="45" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="795" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#000">BF16 hidden_states [S, 5120] + token_tags [S] · once per request</text>

  <!-- Stage 1 -->
  <rect x="1100" y="55" width="760" height="350" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="1130" y="98" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#000">STAGE 1</text>
  <text x="1830" y="98" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#000">GPU 4,5,6,7 · NUMA 1</text>

  <rect x="1150" y="135" width="195" height="105" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="1247" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000">Leader GPU 4</text>
  <text x="1247" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#000">NIXL get()</text>

  <line x1="1345" y1="188" x2="1392" y2="188" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1400" y="135" width="195" height="105" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="1497" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000">Stage 1 group</text>
  <text x="1497" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#000">TP/USP broadcast</text>

  <line x1="1595" y1="188" x2="1642" y2="188" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1650" y="135" width="160" height="105" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="1730" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#000">H3 DiT</text>
  <text x="1730" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#000">+ Video/Audio VAE</text>

  <rect x="1150" y="285" width="660" height="82" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="1480" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#000">5-step topology screen before full run</text>
  <text x="1480" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#000">TP4 vs TP2 × Ulysses2 · order 4,5,6,7 vs 4,6,5,7</text>

  <!-- Legacy path -->
  <path d="M265 405 L265 495 L555 495" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="565" y="455" width="220" height="80" fill="#fff" stroke="#000" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="675" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#000">Engine Core IPC</text>
  <text x="675" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#000">serialize payload</text>

  <line x1="785" y1="495" x2="837" y2="495" stroke="#000" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <rect x="845" y="455" width="220" height="80" fill="#fff" stroke="#000" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="955" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#000">Orchestrator</text>
  <text x="955" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#000">Python payload route</text>

  <line x1="1065" y1="495" x2="1117" y2="495" stroke="#000" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <rect x="1125" y="455" width="220" height="80" fill="#fff" stroke="#000" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1235" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#000">Stage 1 IPC</text>
  <text x="1235" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#000">deserialize / rebuild</text>

  <path d="M1345 495 L1480 495 L1480 405" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="955" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#000">A — NIXL OFF: conditioning crosses Engine Core IPC and Orchestrator</text>

  <!-- Preflight -->
  <rect x="40" y="635" width="470" height="310" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="70" y="678" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000">PREFLIGHT</text>
  <text x="75" y="724" font-family="Arial, sans-serif" font-size="19" fill="#000">8 × RTX PRO 5000 72 GB · SM120</text>
  <text x="75" y="758" font-family="Arial, sans-serif" font-size="19" fill="#000">PCIe-only · no NVLink · dual NUMA</text>
  <text x="75" y="810" font-family="Arial, sans-serif" font-size="18" fill="#000">1. nvidia-smi topo -m</text>
  <text x="75" y="842" font-family="Arial, sans-serif" font-size="18" fill="#000">2. p2pBandwidthLatencyTest</text>
  <text x="75" y="874" font-family="Arial, sans-serif" font-size="18" fill="#000">3. UCX_LOG_LEVEL=info: confirm transport</text>
  <text x="75" y="906" font-family="Arial, sans-serif" font-size="18" fill="#000">4. Pin CPU/DRAM to each Stage NUMA node</text>

  <!-- Comparison matrix -->
  <rect x="550" y="635" width="570" height="310" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="580" y="678" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000">MATCHED RUNS</text>

  <rect x="590" y="710" width="145" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="662" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#000">A</text>
  <text x="662" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#000">Inline IPC</text>

  <rect x="762" y="710" width="145" height="70" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="834" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#000">B</text>
  <text x="834" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#000">NIXL / UCX</text>

  <rect x="934" y="710" width="145" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="1006" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#000">C</text>
  <text x="1006" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#000">NCCL P2P microbench</text>

  <text x="590" y="825" font-family="Arial, sans-serif" font-size="18" fill="#000">Same prompt · seed · shape · GPU order · precision</text>
  <text x="590" y="858" font-family="Arial, sans-serif" font-size="18" fill="#000">Smoke/profile: 2 steps</text>
  <text x="590" y="891" font-family="Arial, sans-serif" font-size="18" fill="#000">E2E: 50 requested / 49 denoise updates</text>
  <text x="590" y="924" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000">1 warmup + 3 measured rounds · T2VA / FL2VA / Ref2VA</text>

  <!-- Metrics and acceptance -->
  <rect x="1160" y="635" width="700" height="310" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="1190" y="678" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000">PROVE NIXL VALUE</text>
  <text x="1195" y="723" font-family="Arial, sans-serif" font-size="18" fill="#000">Latency: E2E · encoder · transfer · denoise · VAE</text>
  <text x="1195" y="758" font-family="Arial, sans-serif" font-size="18" fill="#000">Data path: orchestrator IPC bytes · effective GB/s</text>
  <text x="1195" y="793" font-family="Arial, sans-serif" font-size="18" fill="#000">Resources: CPU utilization/RSS · per-GPU peak memory</text>
  <text x="1195" y="828" font-family="Arial, sans-serif" font-size="18" fill="#000">Reliability: put/get count · timeout · inline fallback</text>
  <text x="1195" y="863" font-family="Arial, sans-serif" font-size="18" fill="#000">Correctness: conditioning checksum · PSNR/SSIM · audio corr.</text>
  <line x1="1195" y1="886" x2="1825" y2="886" stroke="#000" stroke-width="2"/>
  <text x="1195" y="920" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000">Primary success: conditioning payload bypasses Orchestrator</text>

  <!-- Acceptance strip -->
  <rect x="40" y="985" width="1820" height="60" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="950" y="1023" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#000">Accept B only if: 1 put / 1 get · 0 timeout/fallback · checksum exact · denoise unchanged · E2E and transfer improvement reported separately</text>
</svg>
