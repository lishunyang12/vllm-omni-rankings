   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="135.818103" y="110.892254" transform="rotate(-0 135.818103 110.892254)">Timestamped inbox · deduplication</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="135.818103" y="192.267853" transform="rotate(-0 135.818103 192.267853)">Control and dialogue</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(72.286541 217.247872)">Direct supported actions OR</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(82.004431 232.547872)">local Qwen3-4B planner</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="135.818103" y="308.292164" transform="rotate(-0 135.818103 308.292164)">Next-window scheduler</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(56.145603 333.272182)">Whole-answer queue + scene facts</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(92.492947 348.572182)">One-clip lookahead</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="528.817863" y="85.912236" transform="rotate(-0 528.817863 85.912236)">Persistent model service · vLLM-Omni</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="528.817863" y="110.892254" transform="rotate(-0 528.817863 110.892254)">Exact reference/conditioning reuse · fused Turbo adapter · exact AdaLN</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="528.817863" y="192.267853" transform="rotate(-0 528.817863 192.267853)">Four-step joint audio/video DiT</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(411.677238 217.247872)">TP1 / SP8 · dense Sage · resident MXFP8 projections</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(432.264035 232.547872)">BF16 RDMA transport · fused SwiGLU / FC2</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="528.817863" y="314.737959" transform="rotate(-0 528.817863 314.737959)">Decode and package</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(435.659426 340.23618)">Video VAE PP8 / NVFP4 + FP32 audio VAE</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(405.189504 355.017977)">GPU RGB packing → pinned D2H → MP4 + original PCM</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="528.817863" y="443.653859" transform="rotate(-0 528.817863 443.653859)">Accepted media and state</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(395.745129 468.633877)">Decode / drift / seam / speech checks → atomic publication</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172c3a" transform="translate(400.681066 483.933877)">Accepted raw AV tail; one same-parent retry on rejection</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="396.627035" y="566.123964" transform="rotate(-0 396.627035 566.123964)">Persistent FFmpeg → Twitch → viewer</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c3a" x="396.627035" y="591.103982" transform="rotate(-0 396.627035 591.103982)">Continuous frame/sample clock · native PCM input · final H.264 / AAC broadcast</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f75" x="32.209076" y="439.163055" transform="rotate(-0 32.209076 439.163055)">Accepted state only</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #087f75" transform="translate(32.209076 459.30041)">No hidden image reset;</text>
